<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Machine Data</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>
    <button id="connectWallet">Connect Wallet</button>
    <button id="fetchData" disabled>Fetch Contract Anomalies</button>
    <button id="fetchServerData">Fetch Server Anomalies</button>
    <button id="liveFetch">Start Live</button>

    <h2>Contract Anomalies</h2>
    <ul id="contractAnomalies"></ul>

    <h2>Server Anomalies (from anomalies.json)</h2>
    <ul id="serverAnomalies"></ul>

    <h2>Transaction Details</h2>
    <table>
        <thead>
            <tr>
                <th>Transaction Hash</th>
                <th>Gas Used</th>
                <th>Block Number</th>
            </tr>
        </thead>
        <tbody id="transactionDetails"></tbody>
    </table>

    <script>
        const CONTRACT_ADDRESS = "0x73511669fd4dE447feD18BB79bAFeAC93aB7F31f"; // Replace with your deployed contract address
        const CONTRACT_ABI = [
            {
                "inputs": [],
                "name": "getAnomalyMachineIDs",
                "outputs": [{ "internalType": "string[]", "name": "", "type": "string[]" }],
                "stateMutability": "view",
                "type": "function",
            },
        ];

        const SERVER_URL = "http://localhost:8045/anomalies.json";
        let provider, signer, contract;
        let liveInterval = null;

        // Connect to MetaMask
        document.getElementById("connectWallet").addEventListener("click", async () => {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({ method: "eth_requestAccounts" });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    alert("Wallet connected!");
                    document.getElementById("fetchData").disabled = false;
                } catch (error) {
                    console.error("Error connecting wallet:", error);
                    alert("Failed to connect wallet.");
                }
            } else {
                alert("MetaMask is not installed. Please install MetaMask and try again.");
            }
        });

        // Fetch anomaly data from the contract
        document.getElementById("fetchData").addEventListener("click", async () => {
            try {
                const anomalies = await contract.getAnomalyMachineIDs();
                const contractAnomaliesList = document.getElementById("contractAnomalies");
                contractAnomaliesList.innerHTML = "";
                anomalies.forEach((machineID) => {
                    const li = document.createElement("li");
                    li.textContent = machineID;
                    contractAnomaliesList.appendChild(li);
                });
            } catch (error) {
                console.error("Error fetching anomaly data:", error);
                alert("Failed to fetch anomaly data. Check the console for details.");
            }
        });

        // Fetch anomalies.json from the server
        document.getElementById("fetchServerData").addEventListener("click", async () => {
            try {
                const res = await fetch(SERVER_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const list = document.getElementById("serverAnomalies");
                list.innerHTML = "";
                const items = data.contractAnomalies ?? data.localAnomalies ?? data;
                (Array.isArray(items) ? items : []).forEach(id => {
                    const li = document.createElement("li");
                    li.textContent = id;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Failed to fetch server anomalies:", err);
                alert("Failed to fetch server anomalies. Check the console for details.");
            }
        });

        // Start/stop live polling for server anomalies
        document.getElementById("liveFetch").addEventListener("click", (ev) => {
            const btn = ev.currentTarget;
            if (liveInterval) {
                clearInterval(liveInterval);
                liveInterval = null;
                btn.textContent = "Start Live";
            } else {
                fetchServerAnomalies(); // immediate
                liveInterval = setInterval(fetchServerAnomalies, 5000); // every 5s
                btn.textContent = "Stop Live";
            }
        });

        // Fetch server anomalies (used for live polling)
        async function fetchServerAnomalies() {
            try {
                const res = await fetch(SERVER_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const list = document.getElementById("serverAnomalies");
                list.innerHTML = "";
                const items = data.contractAnomalies ?? data.localAnomalies ?? data;
                (Array.isArray(items) ? items : []).forEach(id => {
                    const li = document.createElement("li");
                    li.textContent = id;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Failed to fetch server anomalies:", err);
            }
        }

        // Example: Show transaction details (modify as needed for your use case)
        async function showTransactionDetails(txHash) {
            try {
                const txReceipt = await provider.getTransactionReceipt(txHash);
                const table = document.getElementById("transactionDetails");
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${txReceipt.transactionHash}</td>
                    <td>${txReceipt.gasUsed.toString()}</td>
                    <td>${txReceipt.blockNumber}</td>
                `;
                table.appendChild(row);
            } catch (err) {
                console.error("Failed to fetch transaction details:", err);
            }
        }
    </script>
</body>

</html>
